# Non-secret Cloud Run environment for topskill-api (SPEC 4.1, owner decisions D1 and D6).
# Secrets are NOT here: MANDATE_SIGNING_KEY and GEMINI_API_KEY are injected from Secret Manager
# with --set-secrets (deploy/cloudbuild.yaml). APP_VERSION is appended at build time (git sha).
# Never add emulator hosts or AUTH_DEV_BYPASS here: the boot guard refuses to start with them.
ENV: "prod"
LOG_LEVEL: "INFO"
LLM_MODE: "live"

GOOGLE_CLOUD_PROJECT: "top-skill"
FIRESTORE_PROJECT: "top-skill"
GOOGLE_CLOUD_LOCATION: "global"
GOOGLE_GENAI_USE_VERTEXAI: "true"

STORAGE_BACKEND: "gcs"
GCS_BUCKET: "top-skill-files"

# Knowledge = Gemini File Search via the Developer API (D1); GEMINI_API_KEY comes from Secret Manager.
KNOWLEDGE_BACKEND: "file_search"
MODEL_FILE_SEARCH: "gemini-3.1-flash-lite"
RAG_TOP_K: "4"

# Models (D6, verified on Vertex global 2026-10-15).
MODEL_CHAT: "gemini-3.8-flash"
MODEL_CHAT_FALLBACK: "gemini-3-flash-preview"
MODEL_DRAFT: "gemini-3.8-flash"
MODEL_DRAFT_FALLBACK: "gemini-3-flash-preview"
MODEL_DRAFT_PRO: "gemini-3.1-pro-preview"
MODEL_DRAFT_PRO_FALLBACK: "gemini-2.5-pro"
MODEL_EXTRACT: "gemini-3.8-flash"
MODEL_EXTRACT_FALLBACK: "gemini-3-flash-preview"
MODEL_ASSISTANT: "gemini-3.8-flash"
MODEL_ASSISTANT_FALLBACK: "gemini-3-flash-preview"
MODEL_IMAGE: "gemini-3.1-flash-image"
MODEL_IMAGE_FALLBACK: "gemini-2.5-flash-image"
CHAT_MODEL_ALLOWLIST: "gemini-3.8-flash,gemini-3-flash-preview,gemini-3.1-pro-preview,gemini-2.5-pro"

CREATOR_REVENUE_SHARE_BP: "8000"
SIGNUP_GRANT_CENTS: "10000"
DEMO_TOPUP_CENTS: "5000"
DEMO_TOPUP_DAILY_LIMIT: "5"

PUBLIC_API_BASE: "https://topskill-api-920441209758.asia-southeast1.run.app"
PUBLIC_WEB_BASE: "https://top-skill.web.app"
CORS_ORIGINS: "https://top-skill.web.app,https://top-skill.firebaseapp.com,http://localhost:5173"
CORS_ORIGIN_REGEX: "^https://top-skill--[a-z0-9-]+\\.web\\.app$"

MANDATE_KID: "tsk-2026-10"
MANDATE_MAX_TTL_MINUTES: "1440"
MANDATE_MAX_BUDGET_CENTS: "100000"

TURN_IDLE_TIMEOUT_S: "120"
TURN_TOTAL_TIMEOUT_S: "300"
MAX_CONCURRENT_TURNS: "40"
MAX_ROUNDS_PER_CONVERSATION: "30"
MAX_LLM_CALLS_PER_TURN: "8"
DRAFT_RATE_LIMIT_PER_HOUR: "30"
AVATAR_RATE_LIMIT_PER_HOUR: "20"
A2A_CALL_TIMEOUT_S: "120"

# Voice mode (P2, SPEC 18.1): Gemini Live on Vertex; primary on global, fallback on us-central1.
VOICE_ENABLED: "true"
VOICE_MODEL: "gemini-live-2.5-flash"
VOICE_LOCATION: "global"
VOICE_MODEL_FALLBACK: "gemini-live-2.5-flash-native-audio"
VOICE_LOCATION_FALLBACK: "us-central1"
VOICE_MAX_SESSION_S: "540"
VOICE_IDLE_TIMEOUT_S: "90"
VOICE_CONNECT_TIMEOUT_S: "12"
VOICE_MAX_TOOL_CALLS_PER_ROUND: "8"

# P2 guard: Model Armor screening of public agents (SPEC §18 "Guard"). Fail-open on errors; GUARD_BACKEND=off
# disables it everywhere (per-agent switch: config.safety_screening). Needs roles/modelarmor.user.
GUARD_BACKEND: "model_armor"
GUARD_PROJECT: "top-skill"
GUARD_LOCATION: "asia-southeast1"
GUARD_TEMPLATE: "topskill-public"
GUARD_TIMEOUT_S: "3"
GUARD_MAX_CHARS: "20000"
GUARD_PROMPT_BLOCK_FILTERS: "pi_and_jailbreak,rai,malicious_uris,csam"
GUARD_RESPONSE_BLOCK_FILTERS: "csam"
GUARD_REDACT_SDP: "true"

# Tracing (P2, SPEC §18.3): spans -> Cloud Trace via telemetry.googleapis.com (runtime SA needs
# roles/telemetry.tracesWriter). Every chat turn / A2A call is sampled; health probes at 1%.
TRACING_ENABLED: "true"
TRACE_SAMPLE_RATIO_TURNS: "1.0"
TRACE_SAMPLE_RATIO: "1.0"
TRACE_SAMPLE_RATIO_HEALTH: "0.01"
TRACE_CAPTURE_CONTENT: "false"

# Ask your data (P2, SPEC 18 analytics): BigQuery dataset top-skill:topskill_analytics, synced from Firestore by
# POST /api/internal/analytics/sync (Cloud Scheduler, OIDC as the scheduler SA) and on demand.
ANALYTICS_ENABLED: "true"
ANALYTICS_DATASET: "topskill_analytics"
ANALYTICS_LOCATION: "asia-southeast1"
ANALYTICS_MAX_BYTES: "104857600"
ANALYTICS_ASK_PER_HOUR: "30"
ANALYTICS_SYNC_INVOKERS: "topskill-scheduler@top-skill.iam.gserviceaccount.com"
MODEL_ANALYTICS: "gemini-3.8-flash"
MODEL_ANALYTICS_FALLBACK: "gemini-3-flash-preview"
