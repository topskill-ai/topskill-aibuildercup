[project]
name = "topskill"
version = "0.1.0"
description = "TopSkill API: turn expert skills into paid AI agents (web + A2A)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk==1.2.2",
    "cryptography>=50.0.2",
    "fastapi>=0.141",
    "firebase-admin==7.7.0",
    "google-adk[a2a]==2.12.0",
    "google-auth>=2.62",
    "google-cloud-bigquery>=3.30",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage>=3.17",
    "google-genai==2.31.0",
    "httpx>=0.27",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-propagator-gcp>=1.9",
    "pillow>=12.3.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topskill"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E702", "E701"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["unit", "emulator", "live"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]
